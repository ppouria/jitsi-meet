name: Build Windows desktop client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'desktop/windows/**'
      - '.github/workflows/windows-desktop.yml'

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop/windows

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: desktop/windows/package-lock.json
      - name: Use stable Rust
        run: rustup default stable
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/windows/src-tauri/target
          key: windows-tauri-${{ hashFiles('desktop/windows/src-tauri/Cargo.lock') }}
          restore-keys: windows-tauri-
      - name: Install client dependencies
        run: npm ci --no-audit
      - name: Build NSIS installer
        run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mazholl-voice-windows-${{ github.sha }}
          path: desktop/windows/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
