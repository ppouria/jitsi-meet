name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            bundles: nsis,msi
            target: ''
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,appimage
            target: ''
          - name: macOS universal
            os: macos-15-intel
            artifact: macos-universal
            bundles: app,dmg
            target: universal-apple-darwin

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            npm run tauri build -- --bundles ${{ matrix.bundles }}
          fi
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jitsi-meet-desktop-${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 14
